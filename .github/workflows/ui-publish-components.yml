name: Publish UI Components

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  skip-check:
    name: Skip check
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}
      has_token: ${{ steps.token-check.outputs.has_token }}
    permissions:
      actions: write
      contents: read
    steps:
      # Publishing needs a PAT that can check out the repo, push the version
      # bump commit and tags, and authenticate against NPM. Forks that only
      # track upstream have no GH_PAT_UI, so report its absence here and let the
      # publish job skip itself. The secrets context is not available in a
      # job-level `if`, hence the detour through a job output. Keep this step
      # first so it still runs if the duplicate-action check below fails.
      - id: token-check
        env:
          GH_PAT_UI: ${{ secrets.GH_PAT_UI }}
        run: echo "has_token=${GH_PAT_UI:+true}" >> "$GITHUB_OUTPUT"

      - id: skip-check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          do_not_skip: '["schedule", "workflow_dispatch"]'
          paths: |-
            [
              ".node-version",
              "ui/**"
            ]
          skip_after_successful_duplicate: false

  publish-ui-components:
    name: Publish UI components to NPM
    needs: skip-check
    if: ${{ needs.skip-check.outputs.should_skip != 'true' && needs.skip-check.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT_UI }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT_UI }}

      - name: Pull all tags for Lerna semantic release
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/* && \
          git fetch origin +refs/heads/main:refs/remotes/origin/main && \
          git checkout main

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Config git user
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install packages with pnpm
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        working-directory: ui
        run: pnpm run build

      - name: Bump versions and publish packages
        working-directory: ui
        run: pnpm run publish:ci
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_UI }}

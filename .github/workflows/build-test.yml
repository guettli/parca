name: Go

on:
  push:
    branches:
    - main
    - release-*
  pull_request:
    branches:
    - main
    - release-*
  merge_group:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # Cancel superseded PR runs, but never cancel a push to main/release: an
  # interrupted run gets SIGTERM'd mid-test and never saves its Go build cache,
  # which leaves the next run cold (a full -race rebuild) and prone to OOM.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Test on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # -race is run on arm64 only. A cold `-race` build of the whole module
          # (stdlib + ~1700 packages, instrumented) exceeds the 16 GB runner and
          # gets OOM-killed mid-test ("the runner has received a shutdown signal"),
          # and because the kill happens before setup-go saves the build cache,
          # every subsequent run is cold again -- a self-sustaining red. Capping
          # parallelism (-p 2) survived a warm PR run but not a fully cold main
          # run. arm64 carries the race detector (its runs complete and stay warm);
          # amd64 runs the same tests without -race, so it always completes cold and
          # is fast. A data race is arch-independent, so one instrumented arch keeps
          # the coverage.
          - arch: amd64
            runner: ubuntu-latest
            enable_race: 'no'
          - arch: arm64
            runner: ubuntu-24.04-arm
            enable_race: 'yes'
    steps:
    - id: skip-check
      uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
      continue-on-error: true
      with:
        do_not_skip: '["schedule", "workflow_dispatch"]'
        paths: |-
          [
            "**.go",
            ".github/workflows/build-test.yml",
            "Makefile",
            ".go-version",
            ".node-version",
            "go.mod",
            "go.sum",
            "ui/**"
          ]
        skip_after_successful_duplicate: false

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}

    - name: Set up Go
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: .go-version

    # Guarded like the others: without this, a skipped run (no checkout) still
    # ran pnpm setup and failed with "No pnpm version is specified".
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}

    - name: Set up Node.js
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
        cache: 'pnpm'
        cache-dependency-path: ui/pnpm-lock.yaml

    - name: Build
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}
      run: |
        make build

    - name: Test
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}
      run: |
        make test ENABLE_RACE=${{ matrix.enable_race }}

    - name: Benchmark
      if: ${{ steps.skip-check.outputs.should_skip != 'true' && matrix.arch == 'amd64' }}
      run: |
        make go/bench

    - name: Archive generated artifacts
      if: ${{ steps.skip-check.outputs.should_skip != 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: parca-bin-${{ matrix.arch }}
        if-no-files-found: error
        path: |
          bin

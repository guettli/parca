name: DuckDB image

# Builds the single-node Parca image with the embedded DuckDB storage backend
# (Dockerfile.duckdb) for linux/amd64, smoke-tests it, and publishes it to
# ghcr.io/<owner>/parca:duckdb on pushes to the duckdb-backend branch.
#
# On pull requests the image is only built and smoke-tested (never pushed).

on:
  push:
    branches:
    - duckdb-backend
  pull_request:
    branches:
    - duckdb-backend
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/parca
  TAG: duckdb

jobs:
  build-smoke-push:
    name: Build, smoke-test and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.duckdb
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — server starts, DuckDB backend loads, query API answers
        run: |
          set -euo pipefail
          docker run -d --name parca-duckdb -p 7070:7070 \
            "${IMAGE}:${TAG}" \
            --storage-backend=duckdb --duckdb-path=/data/parca.duckdb

          echo "Waiting for Parca HTTP server on :7070 ..."
          for i in $(seq 1 60); do
            if curl -sfL -o /dev/null http://localhost:7070/; then
              echo "server is up"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^parca-duckdb$'; then
              echo "container exited early"; docker logs parca-duckdb; exit 1
            fi
            sleep 2
          done

          echo "--- container logs ---"
          docker logs parca-duckdb

          echo "Asserting the DuckDB backend was initialized ..."
          docker logs parca-duckdb 2>&1 | grep -q "initializing DuckDB storage backend"

          echo "Asserting the UI is served ..."
          curl -sfL -o /dev/null http://localhost:7070/

          echo "Asserting the query API answers (ProfileTypes) ..."
          curl -sf -X POST http://localhost:7070/parca.query.v1alpha1.QueryService/ProfileTypes \
            -H 'Content-Type: application/json' -d '{}'

          docker rm -f parca-duckdb

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.duckdb
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

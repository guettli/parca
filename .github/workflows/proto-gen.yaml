name: proto-gen

on:
  # See proto-pr.yaml: a declarative paths filter replaces the backtracking
  # skip-check job, which never skipped on this branch.
  pull_request:
    paths:
      - '.github/workflows/proto-gen.yaml'
      - '.go-version'
      - 'buf.gen.yaml'
      - 'buf.work.yaml'
      - 'proto/**'
  merge_group:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Proto Generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.61.0

      - name: Generate
        # Exclude proto/buf.lock from the drift check: `make proto/generate`
        # runs `buf dep update`, which rewrites buf.lock to the latest BSR
        # digests (we log in anonymously, no pinning), so the lock legitimately
        # differs run-to-run. This check should verify generated *code* is
        # current, not that the lockfile chases upstream BSR.
        run:
          make proto/generate && git diff --exit-code ':!ui/packages/app/web/public/keep.go' ':!proto/buf.lock'

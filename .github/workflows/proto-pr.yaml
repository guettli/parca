name: proto-pr

on:
  # Native path filter replaces the skip-duplicate-actions "skip-check" job:
  # that job backtracks through history and refuses to skip once it hits any
  # ancestor commit that touched proto files (the FrostDB-removal refactor did),
  # so it never skipped here. A declarative paths filter is deterministic — the
  # proto checks run only when proto/buf files actually change.
  pull_request:
    paths:
      - '.github/workflows/proto-pr.yaml'
      - '.go-version'
      - 'buf.gen.yaml'
      - 'buf.work.yaml'
      - 'proto/**'
  merge_group:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Proto PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.61.0

      - name: version
        run: buf --version

      - name: Format
        run: buf format --diff --exit-code

      - uses: bufbuild/buf-lint-action@06f9dd823d873146471cfaaf108a993fe00e5325 # v1.1.1
        with:
          input: 'proto'

      - uses: bufbuild/buf-breaking-action@c57b3d842a5c3f3b454756ef65305a50a587c5ba # v1.1.4
        with:
          input: 'proto'
          # Compare against the PR's base branch, not main. This flags only the
          # breaking changes THIS PR introduces, rather than re-flagging proto
          # deletions the base branch (duckdb-backend) already carries from the
          # FrostDB-removal refactor. Falls back to main for merge_group/push.
          against: "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref || 'main' }},subdir=proto"

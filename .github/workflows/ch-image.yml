# Fork-only image build for the ClickHouse-backend Parca (Dockerfile.ch).
#
# Publishes ghcr.io/<owner>/parca:ch-<short-sha> — an immutable tag, so a
# rebuild can never silently change what a deployment is pinned to. The
# gitops Parca Deployment pins one of these tags.
#
# This workflow is deliberately NOT on main: main tracks pristine upstream so
# PRs can be cut against it cleanly. Push-triggered runs use the workflow file
# from the pushed ref, so living on a feature branch is enough.
name: ClickHouse image

on:
  push:
    branches:
      - 'fix-**'
      - 'ch-**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/parca"
          SHA="$(git rev-parse --short HEAD)"
          echo "image=$IMAGE"        >> "$GITHUB_OUTPUT"
          echo "tag=ch-$SHA"         >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ch
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          set -euo pipefail
          REF="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

          # The binary must start and print usage.
          out="$(docker run --rm "$REF" /parca --help 2>&1 || true)"
          echo "$out" | head -20
          echo "$out" | grep -q 'Usage: parca' \
            || { echo "FAIL: parca did not print usage"; exit 1; }

          # The ClickHouse flags are declared hidden='' in kong, so they are
          # absent from --help by design -- asserting on help output would
          # always fail. Grep the binary instead. distroless has no shell, so
          # copy it out rather than running anything in the image.
          cid="$(docker create "$REF")"
          docker cp "$cid:/parca" /tmp/parca-bin
          docker rm -v "$cid" >/dev/null
          # Grep a literal from the kong tags. NOT "clickhouse-enabled":
          # kong builds that name at runtime from prefix:"clickhouse-" plus the
          # field name, so the joined string is never in the binary.
          grep -qa 'ClickHouse server address' /tmp/parca-bin \
            || { echo "FAIL: clickhouse backend not compiled into this build"; exit 1; }
          echo "OK: usage prints and the clickhouse backend is present"

      - name: Summary
        run: |
          echo "### Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this immutable tag in the gitops Parca Deployment." >> "$GITHUB_STEP_SUMMARY"
